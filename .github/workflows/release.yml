name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AGBA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AGBA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AGBA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AGBA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/agba.jks"
            {
              echo "AGBA_KEYSTORE=$RUNNER_TEMP/agba.jks"
              echo "AGBA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "AGBA_KEY_ALIAS=$KEY_ALIAS"
              echo "AGBA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: make apk VERSION="${GITHUB_REF_NAME#v}"

      - name: Build AAB
        run: make aab VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aGBA-aab-${{ github.ref_name }}
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*.apk
          artifactContentType: application/vnd.android.package-archive
          generateReleaseNotes: true
          allowUpdates: true
